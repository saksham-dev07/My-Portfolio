name: Security monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '18 4 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run install:world
      - run: bun run security:secrets -- --history
      - run: bun run security:audit
      - name: Check public site and contact endpoint routing
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://saksham-dev07.me/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://saksham-dev07.me/api/send)" = "405"
