<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Title & Favicon -->
    <title>Saksham Agarwal | Software Engineer & Applied AI</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- DNS Prefetch & Preconnect for Zero Latency Font Loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Preload Critical 3D Model (7.6MB GLB — start fetch ASAP) -->
    <link rel="preload" href="/desktop_pc/scene-opt.glb" as="fetch" crossorigin="anonymous" />

    <!-- SEO Meta Tags -->
    <meta name="title" content="Saksham Agarwal | Software Engineer & Applied AI" />
    <meta name="description" content="Portfolio of Saksham Agarwal — Software Engineer, B.Tech CSE at VIT Bhopal. Specializing in Full-Stack Development, Applied AI/ML, and Scalable Cloud Systems." />

    <meta name="author" content="Saksham Agarwal" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saksham.dev/" />
    <meta property="og:title" content="Saksham Agarwal | Software Engineer & Applied AI" />

    <meta property="twitter:image" content="/logo.svg" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#050816" />
  </head>
